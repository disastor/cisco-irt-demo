# deployer.yaml
#
# Reusable (workflow_call) deployer, handling all four baseline actions
# via one internal branch — the design-doc "Option A" pattern (extract
# the GKE connect boilerplate once, branch internally on what to do).
#
# IMPORTANT: auth/connect and the actual kubectl action are combined
# into ONE step, not two. Confirmed by a live failure: each step's
# `uses: docker://` launches a fresh container — packages installed via
# apt-get in one step (jq, kubectl, the auth plugin) do NOT persist into
# a later step, even within the same job. The baseline workflow avoided
# this by accident (everything was already one step per job); this file
# hit it directly by splitting connect and action into two steps.
#
# Self-contained on GCP project/cluster/zone (same real values the
# baseline workflow uses) rather than relying on `vars: inherit` from
# the caller. `secrets: inherit` on the calling job is what actually
# matters — reuses the same GCP_SA_KEY secret already set up for the
# baseline workflow (secrets are scoped to the component, not to one
# workflow file).

apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Deployer (reusable)

on:
  workflow_call:
    inputs:
      manifest:
        type: string
        required: true
      environment:
        type: string
        required: true
      action:
        type: string
        required: true
        description: One of CREATE_RELEASE, DELETE_IMAGE, BULK_UPDATE, OS_TYPE_ACCESS
    secrets:
      GCP_SA_KEY:
        required: true

jobs:
  deploy:
    env:
      GCP_PROJECT_ID: 'cb-thunder-v2'
      GCP_CLUSTER: 'disastor-cluster'
      GCP_ZONE: 'us-central1-a'
    steps:
      - name: Connect to GKE and run the requested action
        uses: docker://google/cloud-sdk:slim
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > /tmp/key.json
          gcloud auth activate-service-account --key-file=/tmp/key.json --quiet
          gcloud config set project ${{ env.GCP_PROJECT_ID }} --quiet
          apt-get update -qq && apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin kubectl jq
          gcloud container clusters get-credentials ${{ env.GCP_CLUSTER }} --zone ${{ env.GCP_ZONE }} --quiet

          echo '${{ inputs.manifest }}' > /tmp/manifest.json
          echo "---- Raw manifest ----"
          cat -A /tmp/manifest.json
          echo "-----------------------"

          ACTION="${{ inputs.action }}"
          echo "Action: ${ACTION}, environment: ${{ inputs.environment }}"

          case "$ACTION" in
            CREATE_RELEASE)
              RELEASE_NAME=$(jq -r '.releaseName' /tmp/manifest.json)
              RELEASE_VERSION=$(jq -r '.releaseVersion' /tmp/manifest.json)
              echo "Creating release ${RELEASE_NAME} version ${RELEASE_VERSION}..."
              kubectl create configmap "staged-release-${RELEASE_NAME}" \
                -n irt-demo \
                --from-literal=version="${RELEASE_VERSION}" \
                --from-literal=environment="${{ inputs.environment }}" \
                --dry-run=client -o yaml | kubectl apply -f -
              ;;

            DELETE_IMAGE)
              for image_id in $(jq -r '.deleteImage.images | keys[]' /tmp/manifest.json); do
                echo "Deleting image ${image_id}..."
                kubectl delete configmap "image-${image_id}" -n irt-demo --ignore-not-found
              done
              ;;

            BULK_UPDATE)
              for image_id in $(jq -r '.bulkUpdate.imageIds[]' /tmp/manifest.json); do
                echo "Labeling image ${image_id} as bulk-updated..."
                kubectl label configmap "image-${image_id}" -n irt-demo bulk-updated=true --overwrite
              done
              ;;

            OS_TYPE_ACCESS)
              USER_ID=$(jq -r '.userId' /tmp/manifest.json)
              ACCESS_LEVEL=$(jq -r '.osTypeAccess.accessLevel' /tmp/manifest.json)
              echo "Recording ${ACCESS_LEVEL} access request for ${USER_ID}..."
              kubectl create configmap "access-request-${USER_ID}" \
                -n irt-demo \
                --from-literal=requestedBy="${USER_ID}" \
                --from-literal=accessLevel="${ACCESS_LEVEL}" \
                --dry-run=client -o yaml | kubectl apply -f -
              ;;

            *)
              echo "Unknown action: ${ACTION}"
              exit 1
              ;;
          esac

          echo "Current cluster state:"
          kubectl get configmaps -n irt-demo
