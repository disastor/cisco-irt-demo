# deployer.yml
#
# Reusable (workflow_call) deployer, invoked by release-wf.yml's
# Demo-Cluster stage job. Deliberately self-contained on the GCP
# project/cluster/zone values rather than relying on `vars: inherit`
# from the caller — I haven't confirmed exactly what `vars: inherit`
# forwards for a workflow_call job, so this doesn't depend on it.
# `secrets: inherit` on the calling job IS a documented mechanism
# (workflow_call supports a `secrets:` block), so GCP_SA_KEY is
# declared as a required secret here and actually relied on.
#
# NOT YET RUN — same caveat as release-wf.yml.

apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Deployer (reusable)

on:
  workflow_call:
    inputs:
      manifest:
        type: string
        required: true
      environment:
        type: string
        required: true
    secrets:
      GCP_SA_KEY:
        required: true

jobs:
  deploy:
    env:
      GCP_PROJECT_ID: 'cb-thunder-v2'
      GCP_CLUSTER: 'disastor-cluster'
      GCP_ZONE: 'us-central1-a'
    steps:
      - name: Deploy manifest to GKE
        uses: docker://google/cloud-sdk:slim
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -e
          echo "$GCP_SA_KEY" > /tmp/key.json
          gcloud auth activate-service-account --key-file=/tmp/key.json --quiet
          gcloud config set project ${{ env.GCP_PROJECT_ID }} --quiet
          apt-get update -qq && apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin kubectl jq
          gcloud container clusters get-credentials ${{ env.GCP_CLUSTER }} --zone ${{ env.GCP_ZONE }} --quiet

          echo '${{ inputs.manifest }}' > /tmp/manifest.json
          echo "---- Raw contents of /tmp/manifest.json ----"
          cat -A /tmp/manifest.json
          echo "---------------------------------------------"
          RELEASE_NAME=$(jq -r '.releaseName' /tmp/manifest.json)
          RELEASE_VERSION=$(jq -r '.releaseVersion' /tmp/manifest.json)

          echo "Deploying ${RELEASE_NAME} version ${RELEASE_VERSION} to environment: ${{ inputs.environment }}"

          kubectl create configmap "staged-release-${RELEASE_NAME}" \
            -n irt-demo \
            --from-literal=version="${RELEASE_VERSION}" \
            --from-literal=environment="${{ inputs.environment }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Current staged releases:"
          kubectl get configmaps -n irt-demo -l '!fileName'
