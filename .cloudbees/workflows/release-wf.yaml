# release-wf.yml
#
# Extended staged-workflow version of the baseline demo — same underlying
# capability as irt-demo-baseline.yaml (multi-select actions, real GKE
# deploy, admin approval gate), presented as a CD/RO-style staged
# pipeline instead of a flat job list. Stage names deliberately borrow
# from Cisco's own real CD/RO pipeline (Request, Release, Images-Deletion,
# Images-BulkUpdate, GuestApproval) so the shape looks familiar.
#
# Multi-select still works the same way as the baseline: `actions` is a
# comma-separated field embedded inside the manifest JSON. The difference
# is execution order, not capability — staged workflows enforce strict
# sequential stages (confirmed by a live schema error: each stage's job
# must `needs:` every terminal job of the stage immediately before it).
# So requesting multiple actions still runs all of them in one pipeline,
# they just execute one stage after another instead of in parallel like
# the baseline CI-style workflow does. This is arguably more authentic
# to what Cisco actually sees in CD/RO today — their real pipeline runs
# stages left to right in sequence too, skipping ones that don't apply,
# rather than branching in parallel.
#
# NOT YET RUN. Two things flagged as genuinely new/untested here:
#   - `if:` conditions chain fromJSON(inputs.manifest).actions — a
#     function call followed by property access — which is a new
#     combination we haven't tried before (everything so far has been
#     either a plain input comparison or a single function call, not
#     both chained together).
#   - GuestApproval keeps disallowLaunchByUser: false (matching what
#     already worked in this file, and HPE's own workshop convention)
#     rather than the stricter `true` used in the baseline's OS Type
#     Access gate. Flip to true if you want the same separation-of-duties
#     story reinforced here too — just means you'll need a second
#     approver account again, same tradeoff as before.
#
# Example manifest to paste into Unify's "New run" form:
# {
#   "actions": "CREATE_RELEASE,DELETE_IMAGE",
#   "userId": "jdoe",
#   "releaseName": "bulkcreate.1.1",
#   "releaseVersion": "1.2",
#   "deleteImage": { "images": { "3997398": "testPostingTypeChange5.bin" } },
#   "bulkUpdate": { "imageIds": ["4001122", "4001987"] },
#   "osTypeAccess": { "accessLevel": "Admin" }
# }

apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: IRT Demo Release WF

on:
  workflow_dispatch:
    inputs:
      manifest:
        type: string
        required: true
        description: >
          JSON manifest describing what to deploy. See header comment
          for the full example shape.

metadata:
  stages/v1alpha1:
    - name: Request
      jobs: [Request]
    - name: Release
      jobs: [Release]
    - name: Images-Deletion
      jobs: [Images-Deletion]
    - name: Images-BulkUpdate
      jobs: [Images-BulkUpdate]
    - name: GuestApproval
      jobs: [GuestApproval]
    - name: OS-Type-Access
      jobs: [OSTypeAccess-Standard, OSTypeAccess-Admin]

jobs:

  # ---- Always runs: logs the incoming manifest ----
  Request:
    steps:
      - name: Log manifest received
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Manifest received: ${{ inputs.manifest }}"

  # ---- Only runs if actions includes CREATE_RELEASE ----
  Release:
    needs: [Request]
    if: ${{ contains(fromJSON(inputs.manifest).actions, 'CREATE_RELEASE') }}
    environment: demo-cluster
    uses: .cloudbees/workflows/deployer.yaml
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
      action: CREATE_RELEASE

  # ---- Only runs if actions includes DELETE_IMAGE ----
  Images-Deletion:
    needs: [Release]
    if: ${{ contains(fromJSON(inputs.manifest).actions, 'DELETE_IMAGE') }}
    environment: demo-cluster
    uses: .cloudbees/workflows/deployer.yaml
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
      action: DELETE_IMAGE

  # ---- Only runs if actions includes BULK_UPDATE ----
  Images-BulkUpdate:
    needs: [Images-Deletion]
    if: ${{ contains(fromJSON(inputs.manifest).actions, 'BULK_UPDATE') }}
    environment: demo-cluster
    uses: .cloudbees/workflows/deployer.yaml
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
      action: BULK_UPDATE

  # ---- Manual approval gate: only inserted for Admin-level OS Type
  #      Access requests. Named to match Cisco's own real stage name. ----
  GuestApproval:
    needs: [Images-BulkUpdate]
    if: >-
      ${{ contains(fromJSON(inputs.manifest).actions, 'OS_TYPE_ACCESS') &&
          fromJSON(inputs.manifest).osTypeAccess.accessLevel == 'Admin' }}
    with:
      disallowLaunchByUser: false
      notifyAllEligibleUsers: false
      approvers: ""
      approvalInputs: |
        Comment:
          type: string
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1

  # ---- Grants access immediately for non-Admin requests ----
  OSTypeAccess-Standard:
    needs: [GuestApproval]
    if: >-
      ${{ contains(fromJSON(inputs.manifest).actions, 'OS_TYPE_ACCESS') &&
          fromJSON(inputs.manifest).osTypeAccess.accessLevel != 'Admin' }}
    environment: demo-cluster
    uses: .cloudbees/workflows/deployer.yaml
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
      action: OS_TYPE_ACCESS

  # ---- Grants access only after GuestApproval completes ----
  OSTypeAccess-Admin:
    needs: [GuestApproval]
    if: >-
      ${{ contains(fromJSON(inputs.manifest).actions, 'OS_TYPE_ACCESS') &&
          fromJSON(inputs.manifest).osTypeAccess.accessLevel == 'Admin' }}
    environment: demo-cluster
    uses: .cloudbees/workflows/deployer.yaml
    secrets: inherit
    with:
      manifest: ${{ inputs.manifest }}
      environment: ${{ job.environment }}
      action: OS_TYPE_ACCESS
