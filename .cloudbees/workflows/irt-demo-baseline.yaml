# irt-demo-baseline.yaml
#
# Baseline demo workflow for the "reverse demo" 1-hour session.
# Mirrors the foundational IRT pattern Abhiram asked to see:
#   1. Input arrives via webhook (workflow_dispatch, triggered by curl or the
#      mock Release Ops Console).
#   2. Payload is processed through a series of jobs (the "pipeline stages").
#   3. Payload content (cdroEvent) decides which stage(s) run and which are
#      skipped, via native `if:` conditionals.
#   4. Output is a REAL deployment step against a GKE cluster — see
#      gcp-setup.md for how to provision the cluster and secret this
#      workflow depends on. Each job talks to Kubernetes directly via
#      kubectl, authenticated as a GCP service account stored as a secret.
#
# Corrections applied against docs.cloudbees.com + live runs on a real
# Unify org:
#   - apiVersion/kind/name are required workflow metadata.
#   - Every `if:` expression must be wrapped in ${{ }}.
#   - workflow_dispatch input `type` only supports string, boolean, choice —
#     no `number` — so osTypeId/releaseNumberId are declared as string.
#   - Every step with a `run:` also needs `uses: docker://<image>` + `shell:`
#     — CloudBees Unify has no implicit "run on the runner OS" step.
#   - This runtime's actual supported expression functions (confirmed by a
#     live error) are: cloudbees, contains, endsWith, format, fromJSON,
#     hashFiles, inputs, job, join, needs, secrets, startsWith, toJSON,
#     vars — NOT success()/failure()/cancelled()/always(), despite those
#     being documented. That rules out a single fan-in "deploy" job that
#     needs all four conditional jobs. Fix: the deploy step lives at the
#     end of each conditional job instead of a separate converging job.
#
# PREREQUISITES (see gcp-setup.md):
#   - A GKE cluster named per GCP_CLUSTER below, with an `irt-demo`
#     namespace seeded with a few `image-<id>` ConfigMaps.
#   - A GCP service account key stored as the Unify secret `GCP_SA_KEY`,
#     scoped to roles/container.developer on that cluster's project.

apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: IRT demo baseline

env:
  GCP_PROJECT_ID: 'cb-thunder-v2'
  GCP_CLUSTER: 'disastor-cluster'
  GCP_ZONE: 'us-central1-a'

on:
  workflow_dispatch:
    inputs:
      userId:
        type: string
        required: true
        description: Requesting user's ID
      cdroEvent:
        type: choice
        required: true
        description: Which operation this request represents
        options:
          - CREATE_RELEASE
          - DELETE_IMAGE
          - BULK_UPDATE
          - OS_TYPE_ACCESS
      osTypeId:
        type: string
        required: true
      osTypeName:
        type: string
        required: true
      releaseNumberId:
        type: string
        required: true
      releaseName:
        type: string
        required: true
      accessLevel:
        type: choice
        required: false
        default: Read
        description: >
          Only meaningful for OS_TYPE_ACCESS requests — gates whether the
          manual approval job runs.
        options:
          - Read
          - Publish
          - Admin
      payload:
        type: string
        required: false
        description: >
          Raw JSON string carrying event-specific fields (e.g. the
          deleteImage.images map, bulkUpdate.imageIds list, or
          osTypeAccess request details). Parsed inside the job that needs it.

jobs:

  # ---- Always runs: stands in for IRT's role/authorization check ----
  auth-check:
    steps:
      - name: Validate user role
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Checking authorization for user '${{ inputs.userId }}'..."
          # In the real integration this calls Cisco's existing role
          # microservice (the same one CD/RO calls today) instead of
          # a hardcoded pass. Fail the job here to fail the whole run,
          # exactly like CD/RO does at its Request stage today.
          echo "Authorized."

  # ---- Always runs: logs the incoming request for traceability ----
  request-received:
    needs: [auth-check]
    steps:
      - name: Log request
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Event: ${{ inputs.cdroEvent }}"
          echo "Release: ${{ inputs.releaseName }} (#${{ inputs.releaseNumberId }})"
          echo "OS type: ${{ inputs.osTypeName }} (${{ inputs.osTypeId }})"

  # ---- Conditional stage: only runs for CREATE_RELEASE ----
  create-release:
    needs: [request-received]
    if: ${{ inputs.cdroEvent == 'CREATE_RELEASE' }}
    steps:
      - name: Create release record
        uses: docker://bash:5
        shell: bash
        run: echo "Creating release ${{ inputs.releaseName }}..."

      - name: Deploy to GKE — create release ConfigMap
        uses: docker://google/cloud-sdk:slim
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -e
          echo "$GCP_SA_KEY" > /tmp/key.json
          gcloud auth activate-service-account --key-file=/tmp/key.json --quiet
          gcloud config set project ${{ env.GCP_PROJECT_ID }} --quiet
          apt-get update -qq && apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin kubectl
          gcloud container clusters get-credentials ${{ env.GCP_CLUSTER }} --zone ${{ env.GCP_ZONE }} --quiet

          kubectl create configmap "release-${{ inputs.releaseNumberId }}" \
            -n irt-demo \
            --from-literal=releaseName="${{ inputs.releaseName }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Current releases in cluster:"
          kubectl get configmaps -n irt-demo -l '!fileName'

  # ---- Conditional stage: only runs for DELETE_IMAGE ----
  delete-image:
    needs: [request-received]
    if: ${{ inputs.cdroEvent == 'DELETE_IMAGE' }}
    steps:
      - name: Deploy to GKE — delete image ConfigMap(s)
        uses: docker://google/cloud-sdk:slim
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -e
          echo "$GCP_SA_KEY" > /tmp/key.json
          gcloud auth activate-service-account --key-file=/tmp/key.json --quiet
          gcloud config set project ${{ env.GCP_PROJECT_ID }} --quiet
          apt-get update -qq && apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin kubectl jq
          gcloud container clusters get-credentials ${{ env.GCP_CLUSTER }} --zone ${{ env.GCP_ZONE }} --quiet

          echo '${{ inputs.payload }}' > /tmp/payload.json

          echo "Before deletion:"
          kubectl get configmaps -n irt-demo

          for image_id in $(jq -r '.deleteImage.images | keys[]' /tmp/payload.json); do
            echo "Deleting image ${image_id}..."
            kubectl delete configmap "image-${image_id}" -n irt-demo --ignore-not-found
          done

          echo "After deletion:"
          kubectl get configmaps -n irt-demo

  # ---- Conditional stage: only runs for BULK_UPDATE ----
  bulk-update:
    needs: [request-received]
    if: ${{ inputs.cdroEvent == 'BULK_UPDATE' }}
    steps:
      - name: Deploy to GKE — label images as bulk-updated
        uses: docker://google/cloud-sdk:slim
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -e
          echo "$GCP_SA_KEY" > /tmp/key.json
          gcloud auth activate-service-account --key-file=/tmp/key.json --quiet
          gcloud config set project ${{ env.GCP_PROJECT_ID }} --quiet
          apt-get update -qq && apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin kubectl jq
          gcloud container clusters get-credentials ${{ env.GCP_CLUSTER }} --zone ${{ env.GCP_ZONE }} --quiet

          echo '${{ inputs.payload }}' > /tmp/payload.json

          for image_id in $(jq -r '.bulkUpdate.imageIds[]' /tmp/payload.json); do
            echo "Labeling image ${image_id} as bulk-updated..."
            kubectl label configmap "image-${image_id}" -n irt-demo bulk-updated=true --overwrite
          done

          echo "Current image labels:"
          kubectl get configmaps -n irt-demo --show-labels

  # ---- Conditional stage: only runs for OS_TYPE_ACCESS. Always runs first,
  #      regardless of requested access level — logs the request and sends
  #      a (mocked) Slack-style notification. ----
  os-type-access-request:
    needs: [request-received]
    if: ${{ inputs.cdroEvent == 'OS_TYPE_ACCESS' }}
    outputs:
      needsApproval: ${{ steps.check-approval.outputs.needsApproval }}
    steps:
      - name: Route access request
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Payload: ${{ inputs.payload }}"
          echo "Routing OS type access request for approval..."

      - name: Notify (mocked Slack message)
        uses: docker://bash:5
        shell: bash
        run: |
          echo "---- Mock Slack notification (not a real integration) ----"
          if [ "${{ inputs.accessLevel }}" = "Admin" ]; then
            echo "#access-approvals"
            echo "🔐 Admin access requested by ${{ inputs.userId }} — approval required before this is granted."
          else
            echo "#access-requests"
            echo "✅ ${{ inputs.accessLevel }} access auto-granted to ${{ inputs.userId }} — no approval required at this level."
          fi
          echo "-----------------------------------------------------------"

      # Computed here, in a normal job, because `inputs.*` is NOT available
      # the same way inside a `delegates:` (custom job) like the manual
      # approval job below — confirmed by a live error. Passing the
      # decision forward as a job output sidesteps that entirely.
      - id: check-approval
        name: Determine whether approval is required
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Received accessLevel: '${{ inputs.accessLevel }}'"
          if [ "${{ inputs.accessLevel }}" = "Admin" ]; then
            echo "true" > "$CLOUDBEES_OUTPUTS/needsApproval"
          else
            echo "false" > "$CLOUDBEES_OUTPUTS/needsApproval"
          fi

  # ---- Manual approval gate: only inserted when Admin access is requested.
  #      Real CloudBees Unify manual-approval job — approvers default to
  #      whoever holds the "Approver" role since none are listed explicitly.
  #      disallowLaunchByUser prevents the requester from approving their
  #      own request — the same separation-of-duties pattern IRT's own
  #      Guest/OS-type approvals rely on.
  #      NOTE: this job's `if:` reads needs.*.outputs, not inputs.* directly
  #      — a delegates/custom job's own `inputs` context refers to its own
  #      `with:` schema, not the workflow's top-level inputs. ----
  os-type-access-approval:
    needs: [os-type-access-request]
    if: ${{ needs.os-type-access-request.outputs.needsApproval == 'true' }}
    with:
      instructions: >
        Reviewing an OS type access request. Check the run's inputs for the
        requesting user and OS type — approve or reject below.
      disallowLaunchByUser: true
      approvalInputs: |
        approverComments:
          type: string
    timeout-minutes: 4320
    delegates: cloudbees-io/manual-approval/custom-job.yml@v1

  # ---- Grants access immediately — only for non-Admin requests, so this
  #      never needs a job that the Admin path might have skipped. ----
  os-type-access-grant-standard:
    needs: [os-type-access-request]
    if: ${{ inputs.cdroEvent == 'OS_TYPE_ACCESS' && inputs.accessLevel != 'Admin' }}
    steps:
      - name: Deploy to GKE — record access request
        uses: docker://google/cloud-sdk:slim
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -e
          echo "$GCP_SA_KEY" > /tmp/key.json
          gcloud auth activate-service-account --key-file=/tmp/key.json --quiet
          gcloud config set project ${{ env.GCP_PROJECT_ID }} --quiet
          apt-get update -qq && apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin kubectl
          gcloud container clusters get-credentials ${{ env.GCP_CLUSTER }} --zone ${{ env.GCP_ZONE }} --quiet

          kubectl create configmap "access-request-${{ inputs.userId }}" \
            -n irt-demo \
            --from-literal=requestedBy="${{ inputs.userId }}" \
            --from-literal=accessLevel="${{ inputs.accessLevel }}" \
            --from-literal=approvalRequired="false" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl get configmaps -n irt-demo -l '!fileName'

  # ---- Grants access only after the approval job above completes — never
  #      needs a job the standard path might have skipped, for the same
  #      reason the standard grant job above never needs the approval job. ----
  os-type-access-grant-admin:
    needs: [os-type-access-approval]
    if: ${{ inputs.cdroEvent == 'OS_TYPE_ACCESS' && inputs.accessLevel == 'Admin' }}
    steps:
      - name: Deploy to GKE — record approved access request
        uses: docker://google/cloud-sdk:slim
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -e
          echo "$GCP_SA_KEY" > /tmp/key.json
          gcloud auth activate-service-account --key-file=/tmp/key.json --quiet
          gcloud config set project ${{ env.GCP_PROJECT_ID }} --quiet
          apt-get update -qq && apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin kubectl
          gcloud container clusters get-credentials ${{ env.GCP_CLUSTER }} --zone ${{ env.GCP_ZONE }} --quiet

          echo "Approval details (raw): ${{ needs.os-type-access-approval.outputs.approvalInputValues }}"

          kubectl create configmap "access-request-${{ inputs.userId }}" \
            -n irt-demo \
            --from-literal=requestedBy="${{ inputs.userId }}" \
            --from-literal=accessLevel="Admin" \
            --from-literal=approvalRequired="true" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl get configmaps -n irt-demo -l '!fileName'
