# irt-demo-baseline.yaml
#
# Baseline demo workflow for the "reverse demo" 1-hour session.
# Mirrors the foundational IRT pattern Abhiram asked to see:
#   1. Input arrives via webhook (workflow_dispatch, triggered by curl or the
#      mock Release Ops Console).
#   2. Payload is processed through a series of jobs (the "pipeline stages").
#   3. Payload content (cdroEvent) decides which stage(s) run and which are
#      skipped, via native `if:` conditionals.
#   4. Output is a (mocked) deployment step — swap the mocked step for a real
#      `kubectl apply` once you have a target cluster / Edge Runner wired up.
#
# Corrections applied against docs.cloudbees.com + a live run on a real
# Unify org:
#   - apiVersion/kind/name are required workflow metadata.
#   - Every `if:` expression must be wrapped in ${{ }}.
#   - workflow_dispatch input `type` only supports string, boolean, choice —
#     no `number` — so osTypeId/releaseNumberId are declared as string.
#   - Every step with a `run:` also needs `uses: docker://<image>` + `shell:`
#     — CloudBees Unify has no implicit "run on the runner OS" step.
#   - IMPORTANT: this runtime's actual supported expression functions
#     (confirmed by a live error message) are: cloudbees, contains,
#     endsWith, format, fromJSON, hashFiles, inputs, job, join, needs,
#     secrets, startsWith, toJSON, vars — NOT success()/failure()/
#     cancelled()/always(), despite those being listed in the docs'
#     workflow syntax reference. That rules out a single fan-in "deploy"
#     job that needs all four conditional jobs (a job that needs a
#     skipped job won't run, and there's no documented override here).
#     Fix: the mocked deploy step is folded into the end of each
#     conditional job instead of a separate converging job. Only one
#     conditional job runs per request, so exactly one deploy still
#     happens per run — this sidesteps the gap entirely rather than
#     working around it.

apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: IRT demo baseline

on:
  workflow_dispatch:
    inputs:
      userId:
        type: string
        required: true
        description: Requesting user's ID
      cdroEvent:
        type: choice
        required: true
        description: Which operation this request represents
        options:
          - CREATE_RELEASE
          - DELETE_IMAGE
          - BULK_UPDATE
          - OS_TYPE_ACCESS
      osTypeId:
        type: string
        required: true
      osTypeName:
        type: string
        required: true
      releaseNumberId:
        type: string
        required: true
      releaseName:
        type: string
        required: true
      payload:
        type: string
        required: false
        description: >
          Raw JSON string carrying event-specific fields (e.g. the
          deleteImage.images map, bulkUpdate.imageIds list, or
          osTypeAccess request details). Parsed inside the job that needs it.

jobs:

  # ---- Always runs: stands in for IRT's role/authorization check ----
  auth-check:
    steps:
      - name: Validate user role
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Checking authorization for user '${{ inputs.userId }}'..."
          # In the real integration this calls Cisco's existing role
          # microservice (the same one CD/RO calls today) instead of
          # a hardcoded pass. Fail the job here to fail the whole run,
          # exactly like CD/RO does at its Request stage today.
          echo "Authorized."

  # ---- Always runs: logs the incoming request for traceability ----
  request-received:
    needs: [auth-check]
    steps:
      - name: Log request
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Event: ${{ inputs.cdroEvent }}"
          echo "Release: ${{ inputs.releaseName }} (#${{ inputs.releaseNumberId }})"
          echo "OS type: ${{ inputs.osTypeName }} (${{ inputs.osTypeId }})"

  # ---- Conditional stage: only runs for CREATE_RELEASE. Deploy folded in. ----
  create-release:
    needs: [request-received]
    if: ${{ inputs.cdroEvent == 'CREATE_RELEASE' }}
    steps:
      - name: Create release record
        uses: docker://bash:5
        shell: bash
        run: echo "Creating release ${{ inputs.releaseName }}..."
      - name: Deploy (mocked)
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Deploying result of CREATE_RELEASE to demo-cluster..."
          sleep 2
          echo "Deployment successful."

  # ---- Conditional stage: only runs for DELETE_IMAGE. Deploy folded in. ----
  delete-image:
    needs: [request-received]
    if: ${{ inputs.cdroEvent == 'DELETE_IMAGE' }}
    steps:
      - name: Parse and delete images
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Payload: ${{ inputs.payload }}"
          echo "Deleting image(s) referenced in payload..."
      - name: Deploy (mocked)
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Deploying result of DELETE_IMAGE to demo-cluster..."
          sleep 2
          echo "Deployment successful."

  # ---- Conditional stage: only runs for BULK_UPDATE. Deploy folded in. ----
  bulk-update:
    needs: [request-received]
    if: ${{ inputs.cdroEvent == 'BULK_UPDATE' }}
    steps:
      - name: Apply bulk update
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Payload: ${{ inputs.payload }}"
          echo "Applying bulk update across referenced images..."
      - name: Deploy (mocked)
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Deploying result of BULK_UPDATE to demo-cluster..."
          sleep 2
          echo "Deployment successful."

  # ---- Conditional stage: only runs for OS_TYPE_ACCESS. Deploy folded in. ----
  os-type-access:
    needs: [request-received]
    if: ${{ inputs.cdroEvent == 'OS_TYPE_ACCESS' }}
    steps:
      - name: Route access request
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Payload: ${{ inputs.payload }}"
          echo "Routing OS type access request for approval..."
      - name: Deploy (mocked)
        uses: docker://bash:5
        shell: bash
        run: |
          echo "Deploying result of OS_TYPE_ACCESS to demo-cluster..."
          sleep 2
          echo "Deployment successful."

      # --- Swap any "Deploy (mocked)" step above for something like this
      #     once a real cluster / Edge Runner is available: ---
      # - name: Deploy to Kubernetes
      #   uses: https://github.com/cloudbees-io/kubectl-deploy@v1
      #   with:
      #     cluster: demo-cluster
      #     namespace: irt-demo
      #     manifest: ./k8s/demo-configmap.yaml
